appId: ch.telemersive.gateway
productName: Telemersive Gateway
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  artifactName: Telemersive-Gateway-${version}-${arch}.${ext}
  identity: "Developer ID Application"
  hardenedRuntime: true
  # UltraGrid's mic/camera access is attributed to this bundle (it is the
  # responsible process for the `uv` child), so the capture entitlements and
  # usage strings must be declared here. See docs/deployment.md.
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: >-
      Telemersive Gateway needs the microphone so UltraGrid can capture and
      stream audio to the other peers in your room.
    NSCameraUsageDescription: >-
      Telemersive Gateway needs the camera so UltraGrid can capture and stream
      video to the other peers in your room.

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Telemersive-Gateway-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true

publish:
  provider: github
  owner: telemersion
  repo: telemersive-portbay
